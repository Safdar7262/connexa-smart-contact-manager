<div th:fragment="messagebox">

    <div th:if="${session.message != null}"
         class="flex items-center p-4 mb-4 text-sm text-green-800 bg-green-100 border border-green-300 rounded-lg">

        <span class="font-semibold mr-2">Message:</span>

        <span th:text="${session.message.content}"></span>

    </div>
    <th:block th:text="${@sessionHelper.removeMessage()}"></th:block>
</div>
