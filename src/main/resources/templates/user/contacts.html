<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">

<head>
    <title>Contact</title>
</head>

<body>

    <div id="content">

        <div class="pt-6">

            <h1 class="text-5xl text-center font-semibold">All your Contacts</h1>
            <p class="text-center text-gray-500 dark:text-gray-400 mt-2">
                List of all contacts...
            </p>

            <div class="p-5">
                <p th:if="${message}" th:text="${message}" class="text-green-500 text-center font-semibold mb-4">
                </p>
                <div
                    class="relative overflow-x-auto bg-white dark:bg-gray-800 shadow-md rounded-lg border border-gray-200 dark:border-gray-700">

                    <div class="flex items-center justify-between flex-wrap gap-4 p-4">

                        <div>
                            <button
                                class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg">
                                Action
                            </button>
                        </div>

                        <div class="relative">
                            <input type="text"
                                class="block w-64 px-4 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200"
                                placeholder="Search">
                        </div>

                    </div>

                    <table class="w-full text-sm text-left text-gray-700 dark:text-gray-300">

                        <thead class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200">
                            <tr>
                                <th class="px-6 py-3">Name</th>
                                <th class="px-6 py-3">Phone</th>
                                <th class="px-6 py-3">Links</th>
                                <th class="px-6 py-3">Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            <!-- LOOP -->
                            <tr th:each="c : ${contacts}" th:object="${c}"
                                class="border-b border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">

                                <td class="px-6 py-4 flex items-center gap-3">
                                    <img th:src="@{*{picture}}" onerror="this.src='https://via.placeholder.com/40'"
                                        class="w-10 h-10 rounded-full">

                                    <div>
                                        <div class="font-semibold" th:text="*{name}"></div>
                                        <div class="text-sm text-gray-500" th:text="*{email}"></div>
                                    </div>
                                </td>

                                <td class="px-6 py-4">
                                    <i class="fa-solid fa-phone"></i>
                                    <span th:text="*{phoneNumber}"></span>
                                </td>

                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">

                                        <div th:if="*{favorite}" class="w-2.5 h-2.5 bg-green-500 rounded-full"></div>

                                        <a th:if="*{webSiteLink}" th:href="*{webSiteLink}" target="_blank">
                                            <i class="fa-solid fa-link"></i>
                                        </a>

                                        <a th:if="*{linkedInLink}" th:href="*{linkedInLink}" target="_blank">
                                            <i class="fa-brands fa-linkedin"></i>
                                        </a>

                                    </div>
                                </td>

                                <td class="px-6 py-4 flex gap-3">

                                    <!-- delete -->
                                    <button type="button" th:attr="data-id=*{id}" onclick="confirmDelete(this)">
                                        <i class="fa-solid fa-trash text-red-500"></i>
                                    </button>

                                    <!-- edit -->
                                    <a th:href="@{'/user/contacts/edit/' + *{id}}">
                                        <i class="fa-solid fa-pen text-green-500"></i>
                                    </a>

                                    <!-- view -->
                                    <a th:href="@{'/user/contacts/view/' + *{id}}">
                                        <i class="fa-solid fa-eye text-blue-500"></i>
                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <th:block id="script">
        <script>
            console.log("Contact page loaded");
        </script>
    </th:block>

</body>

</html>
