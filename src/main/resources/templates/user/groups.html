<!DOCTYPE html>
<html lang="en"
th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>Groups|Connexa</title>
</head>

<body class="bg-gray-50 dark:bg-gray-900 transition duration-300">

<div id="content" class="px-4 sm:px-6 lg:px-8 py-10 max-w-7xl mx-auto">

    <!-- TITLE -->
    <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-900 dark:text-white mb-10">
        👥 Contact Groups
    </h1>

    <!-- CREATE GROUP -->
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md mb-10 border 
                border-gray-200 dark:border-gray-700">

        <form th:action="@{/user/groups/add}" method="post" 
              class="flex flex-col sm:flex-row gap-4">

            <input type="text" name="name" placeholder="Enter Group Name"
                   class="flex-1 px-4 py-2 rounded-lg border 
                          border-gray-300 dark:border-gray-600 
                          bg-gray-50 dark:bg-gray-900 
                          text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500"
                   required>

            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg 
                           hover:bg-blue-700 transition duration-300">
                Create
            </button>

        </form>

    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(groups)}" 
         class="text-center text-gray-500 dark:text-gray-400">
        <p>No groups created yet 😔</p>
    </div>

    <!-- GROUP LIST -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">

        <div th:each="g : ${groups}"
             class="group bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md 
                    hover:shadow-xl hover:-translate-y-2 transition duration-300 
                    border border-gray-200 dark:border-gray-700">

            <!-- ICON + NAME -->
            <div class="flex items-center gap-3 mb-3">
                <span class="text-2xl">👥</span>

                <h3 class="text-lg font-semibold text-gray-900 dark:text-white"
                    th:text="${g.name}">
                </h3>
            </div>

            <!-- CONTACT COUNT -->
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">
                📞 <span th:text="${#lists.size(g.contacts)}"></span> Contacts
            </p>

            <!-- ACTION BUTTONS -->
            <div class="flex gap-3">

                <!-- VIEW -->
                <a th:href="@{'/user/groups/view/' + ${g.id}}"
                   class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm 
                          hover:bg-blue-600 transition">
                    View
                </a>

                <!-- DELETE -->
                <a th:href="@{'/user/groups/delete/' + ${g.id}}"
                   class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm 
                          hover:bg-red-600 transition">
                    Delete
                </a>

            </div>

        </div>

    </div>

</div>

<!-- SCRIPT -->
<script th:fragment="script">
    console.log("Groups Page Loaded ");
</script>

</body>
</html>
