<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{base :: parent(~{::#content},~{::title},~{::#script})}">

<head>
    <title>SignUp</title>
</head>

<body>

    <div id="content">

        <div class="relative min-h-screen flex items-center justify-center p-6
   bg-gradient-to-br from-slate-100 via-blue-100 to-indigo-200
   dark:from-gray-950 dark:via-gray-900 dark:to-gray-800">

            <div class="relative w-full max-w-xl">

                <div class="bg-white/90 dark:bg-gray-900/80 backdrop-blur-md
            border border-gray-200 dark:border-gray-700
            rounded-2xl shadow-2xl p-10">

                    <h2 class="text-3xl font-bold text-center text-gray-800 dark:text-white mb-2">
                        Create Your Account
                    </h2>

                    <p class="text-center text-gray-500 dark:text-gray-400 mb-8">
                        Start managing contacts in the cloud
                    </p>

                    <!-- SUCCESS MESSAGE (FLASH ATTRIBUTE) -->
                    <div th:if="${message}" class="bg-green-500 text-white px-4 py-2 rounded mb-4 text-center">

                        <span th:text="${message.content}"></span>

                    </div>

                    <!-- FORM START -->
                    <form th:action="@{/do-register}" method="post" enctype="multipart/form-data"
                        th:object="${userForm}" class="space-y-5">

                        <!-- VALIDATION ERRORS -->
                        <div th:if="${#fields.hasErrors('*')}" class="bg-red-500 text-white px-4 py-2 rounded mb-4">

                            <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>

                        </div>

                        <!-- NAME -->
                        <input th:field="*{name}" type="text" placeholder="Full Name" class="w-full px-4 py-2 rounded-lg border
                           border-gray-300 dark:border-gray-600
                           dark:bg-gray-800 dark:text-white">

                        <!-- EMAIL -->
                        <input th:field="*{email}" type="email" placeholder="Email" class="w-full px-4 py-2 rounded-lg border
                           border-gray-300 dark:border-gray-600
                           dark:bg-gray-800 dark:text-white">

                        <!-- PASSWORD -->
                        <input th:field="*{password}" type="password" placeholder="Password" class="w-full px-4 py-2 rounded-lg border
                           border-gray-300 dark:border-gray-600
                           dark:bg-gray-800 dark:text-white">

                        <!-- PHONE -->
                        <input th:field="*{phoneNumber}" type="text" placeholder="Phone Number" class="w-full px-4 py-2 rounded-lg border
                           border-gray-300 dark:border-gray-600
                           dark:bg-gray-800 dark:text-white">

                        <!-- ADDRESS -->
                        <input th:field="*{address}" type="text" placeholder="Address" class="w-full px-4 py-2 rounded-lg border
                           border-gray-300 dark:border-gray-600
                           dark:bg-gray-800 dark:text-white">

                        <!-- ABOUT -->
                        <textarea th:field="*{about}" rows="3" placeholder="About you..." class="w-full px-4 py-2 rounded-lg border
                              border-gray-300 dark:border-gray-600
                              dark:bg-gray-800 dark:text-white"></textarea>

                        <!-- IMAGE -->
                        <input type="file" name="profilePic" accept="image/*" onchange="previewImage(event)"
                            class="w-full text-sm text-gray-600 dark:text-gray-300">
                        <!-- PREVIEW IMAGE -->
                        <img id="preview" class="mt-3 w-24 h-24 rounded-full border hidden" />
                        
                        <!-- BUTTONS -->
                        <div class="flex flex-col sm:flex-row gap-3 pt-4">

                            <button type="submit" class="w-full py-2 rounded-lg
                                bg-indigo-600 hover:bg-indigo-700 text-white font-medium">
                                Signup
                            </button>

                            <button type="reset" class="w-full py-2 rounded-lg
                                bg-gray-300 hover:bg-gray-400
                                dark:bg-gray-700 dark:text-white">
                                Reset
                            </button>

                            <a th:href="@{/login}" class="w-full text-center py-2 rounded-lg
                           bg-blue-600 hover:bg-blue-700 text-white font-medium">
                                Go to Login
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <div id="script">
        <script>
            console.log("signup page loaded");
        </script>
    </div>

</body>

</html>
